<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Spatial Ambient Gradients using exact Light Steel palette -->
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#dee2e6" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ced4da" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#6c757d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#212529" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="auroraLight" cx="48%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#f8f9fa" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#e9ecef" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#adb5bd" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#212529" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizonDune1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#495057" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#343a40" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#212529" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="horizonDune2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c757d" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#495057" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#212529" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="softMist" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#dee2e6" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#ced4da" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#212529" stop-opacity="0" />
    </linearGradient>

    <filter id="visionBlurHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" />
    </filter>

    <filter id="visionBlurMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <!-- Deep Spatial Cosmos Base -->
  <rect width="3840" height="2160" fill="url(#skyGlow)" />

  <!-- Ambient Volumetric Light Orbs -->
  <circle cx="1920" cy="650" r="1100" fill="url(#auroraLight)" filter="url(#visionBlurHeavy)" />
  <circle cx="800" cy="400" r="700" fill="#ced4da" fill-opacity="0.18" filter="url(#visionBlurHeavy)" />
  <circle cx="3100" cy="500" r="750" fill="#adb5bd" fill-opacity="0.15" filter="url(#visionBlurHeavy)" />

  <!-- Ethereal Spatial Dunes & Light Curvature -->
  <path d="M-200 1350 Q 800 1100, 1920 1280 T 4040 1200 L 4040 2200 L -200 2200 Z" fill="url(#horizonDune2)" filter="url(#visionBlurMedium)" />
  <path d="M-200 1520 Q 1100 1380, 2100 1480 T 4040 1420 L 4040 2200 L -200 2200 Z" fill="url(#horizonDune1)" />
  <path d="M-200 1750 Q 900 1620, 1920 1700 T 4040 1650 L 4040 2200 L -200 2200 Z" fill="#212529" fill-opacity="0.9" />

  <!-- Horizon Atmospheric Rim Lighting -->
  <ellipse cx="1920" cy="1300" rx="1600" ry="120" fill="url(#softMist)" filter="url(#visionBlurMedium)" />

  <!-- Minimalist Spatial Stars & Specular Dust -->
  <g fill="#f8f9fa" opacity="0.4">
    <circle cx="450" cy="280" r="2.5" />
    <circle cx="920" cy="180" r="1.5" />
    <circle cx="1400" cy="320" r="2" />
    <circle cx="1850" cy="150" r="3" opacity="0.7" />
    <circle cx="2300" cy="260" r="1.5" />
    <circle cx="2800" cy="190" r="2.5" />
    <circle cx="3350" cy="310" r="2" />
    <circle cx="700" cy="600" r="1.5" />
    <circle cx="1200" cy="520" r="2.5" opacity="0.6" />
    <circle cx="2600" cy="580" r="2" />
    <circle cx="3100" cy="450" r="1.5" />
  </g>
</svg>
